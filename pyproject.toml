[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "build",
  "dist",
  "release",
  "venv",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B002",
  "B003",
  "B004",
  "B005",
  "B006",
  "B008",
  "B011",
  "B012",
  "B014",
  "B015",
  "B016",
  "B017",
  "B018",
  "B019",
  "B020",
  "B021",
  "B022",
  "B025",
  "B029",
  "B030",
  "B031",
  "B032",
  "B033",
  "B035",
  "B039",
  "B905",
]

[tool.ruff.lint.isort]
combine-as-imports = true
