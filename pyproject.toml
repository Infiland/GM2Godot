[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "build",
  "dist",
  "release",
  "venv",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "C90",
]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 122
