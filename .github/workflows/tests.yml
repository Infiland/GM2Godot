name: Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          architecture: x64

      - name: Install and verify test dependencies
        run: |
          venv_dir="$RUNNER_TEMP/gm2godot-tests-linux-venv"
          if [ -e "$venv_dir" ] || [ -L "$venv_dir" ]; then
            echo "::error::Refusing to reuse dependency environment: $venv_dir" >&2
            exit 1
          fi
          python scripts/verify_dependency_bootstrap.py \
            --source requirements-bootstrap.txt \
            --policy stable \
            --constraint constraints/requirements-linux-py312.lock \
            --output "$RUNNER_TEMP/tests-linux-bootstrap.json"
          python -m venv "$venv_dir"
          venv_bin="$venv_dir/bin"
          printf 'VIRTUAL_ENV=%s\n' "$venv_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$venv_bin" >> "$GITHUB_PATH"
          export VIRTUAL_ENV="$venv_dir"
          export PATH="$venv_bin:$PATH"
          hash -r
          python -c 'import os, pathlib, sys; raise SystemExit(0 if pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ["VIRTUAL_ENV"]).resolve() else 1)'
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            pip
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            -r requirements.txt
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            coverage==7.15.2 \
            packaging==26.2 \
            ruff==0.15.22
          python scripts/verify_dependency_environment.py \
            --constraint constraints/requirements-linux-py312.lock \
            --mode subset \
            --require pip \
            --require coverage \
            --require packaging \
            --require ruff \
            --require Pillow \
            --require markdown2 \
            --require requests \
            --require PySide6 \
            --expected-python 3.12.13 \
            --expected-platform linux \
            --expected-machine x86_64 \
            --bootstrap requirements-bootstrap.txt \
            --bootstrap-policy stable \
            --output "$RUNNER_TEMP/tests-linux-dependencies.json"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1

      - name: Run required native receipt gate
        timeout-minutes: 10
        shell: bash
        env:
          NATIVE_RECEIPT_PROFILE: stable
        run: >-
          python -m scripts.run_required_unittest
          --manifest architecture-verification.json --gate N01-linux
          --receipt "$RUNNER_TEMP/n01-tests-linux.json"

      - name: Upload required native receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n01-tests-linux
          path: ${{ runner.temp }}/n01-tests-linux.json
          if-no-files-found: error
          retention-days: 30
          archive: true

      - name: Run native linux artifact mode characterization
        run: >-
          python -m unittest -v
          tests.test_conversion_manifest.TestConversionManifest.test_existing_and_new_artifact_modes_remain_exact
          tests.test_diagnostics.TestDiagnosticCollector.test_new_private_modes_and_existing_exact_modes_are_preserved
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_descriptor_callbacks_return_final_mode
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_fd_chmod_rebinding_keeps_selected_rollback_callable
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_noop_and_expected_mode_guard_precedence
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_descriptor_failures_preserve_errors_and_close

      - name: Run native Linux Included Files POSIX operations
        shell: bash
        run: |
          "$VIRTUAL_ENV/bin/python" - "$GITHUB_WORKSPACE" "$VIRTUAL_ENV" <<'PY'
          import inspect
          import json
          import platform
          import sys
          import unittest
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          venv = Path(sys.argv[2]).resolve()
          assert Path.cwd().resolve() == root and Path(sys.prefix).resolve() == venv
          assert Path(sys.executable).resolve() == (venv / "bin" / "python").resolve()
          assert (platform.python_version(), sys.platform, platform.machine()) == ('3.12.13', 'linux', 'x86_64')

          from scripts.run_required_unittest import load_suite, result_is_allowed
          from src.conversion.included_files import IncludedFilesConverter
          from src.conversion.included_files_parts.filesystem_metadata import path_fingerprint
          from src.conversion.included_files_parts.posix_operations import descriptor_paths_supported
          from tests.included_files.test_filesystem_metadata import TestIncludedFilesFilesystemMetadata
          from tests.included_files.test_posix_operations import TestIncludedFilesPosixOperations
          from tests.test_included_files import TestIncludedFilesConverterOutputContainment, TestIncludedFilesManagedRootTransaction

          origins = {
              load_suite: "scripts/run_required_unittest.py",
              result_is_allowed: "scripts/run_required_unittest.py",
              IncludedFilesConverter: "src/conversion/included_files.py",
              path_fingerprint: "src/conversion/included_files_parts/filesystem_metadata.py",
              descriptor_paths_supported: "src/conversion/included_files_parts/posix_operations.py",
              TestIncludedFilesManagedRootTransaction: "tests/test_included_files.py",
              TestIncludedFilesConverterOutputContainment: "tests/test_included_files.py",
              TestIncludedFilesFilesystemMetadata: "tests/included_files/test_filesystem_metadata.py",
              TestIncludedFilesPosixOperations: "tests/included_files/test_posix_operations.py",
          }
          assert all(Path(inspect.getfile(owner)).resolve() == root / path for owner, path in origins.items())
          ids = (
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_linux_mount_id_parser_and_boundary_reject_different_mount",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_native_noreplace_preserves_file_and_directory_destinations",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_native_noreplace_missing_capability_fails_closed",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_descriptor_tree_capture_closes_parent_when_mount_check_fails",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_descriptor_tree_capture_rejects_deep_ancestor_swap",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_descriptor_cleanup_streams_payload_receipts",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_moved_and_symlinked_stage_container_is_rejected",
              "tests.test_included_files.TestIncludedFilesConverterOutputContainment.test_late_output_directory_relocation_is_rejected_before_publish",
              "tests.test_included_files.TestIncludedFilesConverterOutputContainment.test_rejects_final_output_symlink",
              "tests.test_included_files.TestIncludedFilesConverterOutputContainment.test_replaces_final_hardlink_without_mutating_referent",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_recovery_record_staging_syncs_parent_before_durable_phase",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_staged_tree_directories_sync_bottom_up_before_commit_record",
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_restart_rollback_syncs_registry_before_journal_retirement",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_pinned_directory_transfers_live_fd_and_closes_ancestors",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_failed_child_open_closes_owned_fd_before_reuse",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_borrowed_entry_checks_preserve_fd_and_reject_replacement",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_native_rename_transfers_entries_and_preserves_errno",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_restore_and_quarantine_preserve_unexpected_entries",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_mount_id_malformed_missing_and_unavailable_policies",
              "tests.included_files.test_posix_operations.TestIncludedFilesPosixOperations.test_directory_sync_orders_native_fsync_and_closes_on_failures",
              "tests.included_files.test_filesystem_metadata.TestIncludedFilesFilesystemMetadata.test_stat_projections_preserve_exact_fields_and_order",
              "tests.included_files.test_filesystem_metadata.TestIncludedFilesFilesystemMetadata.test_symlink_short_circuit_and_unavailable_junction_policy",
              "tests.included_files.test_filesystem_metadata.TestIncludedFilesFilesystemMetadata.test_junction_checker_result_and_error_are_forwarded",
          )
          assert len(ids) == 23
          suite, discovered = load_suite(ids)
          assert discovered == ids
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert all(Path(inspect.getfile(owner)).resolve() == root / path for owner, path in origins.items())
          accepted = result.testsRun == 23 and result_is_allowed(result, {})
          print(json.dumps({"gate": "I02-linux-posix", "python": sys.executable, "prefix": sys.prefix,
                            "root": str(root), "runtime": [platform.python_version(), sys.platform, platform.machine()],
                            "origins": sorted(set(origins.values())), "selected_ids": list(discovered),
                            "tests_run": result.testsRun, "skip_count": len(result.skipped), "accepted": accepted}, sort_keys=True))
          raise SystemExit(0 if accepted else 1)
          PY

      - name: Run unit tests
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover tests/ -v

      - name: Generate Python coverage reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p coverage-reports
          python -m coverage report
          python -m coverage json
          python -m coverage xml

      - name: Run privileged Linux Included Files bind-mount proof
        shell: bash
        run: |
          sudo -n "$VIRTUAL_ENV/bin/python" - "$GITHUB_WORKSPACE" "$VIRTUAL_ENV" <<'PY'
          import inspect
          import json
          import platform
          import sys
          import unittest
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          venv = Path(sys.argv[2]).resolve()
          assert Path.cwd().resolve() == root and Path(sys.prefix).resolve() == venv
          assert Path(sys.executable).resolve() == (venv / "bin" / "python").resolve()
          assert (platform.python_version(), sys.platform, platform.machine()) == ("3.12.13", "linux", "x86_64")

          from scripts.run_required_unittest import load_suite, result_is_allowed
          from src.conversion.included_files import IncludedFilesConverter
          from src.conversion.included_files_parts.filesystem_metadata import path_fingerprint
          from src.conversion.included_files_parts.posix_operations import descriptor_paths_supported
          from tests.test_included_files import TestIncludedFilesManagedRootTransaction

          origins = {
              load_suite: "scripts/run_required_unittest.py",
              result_is_allowed: "scripts/run_required_unittest.py",
              IncludedFilesConverter: "src/conversion/included_files.py",
              path_fingerprint: "src/conversion/included_files_parts/filesystem_metadata.py",
              descriptor_paths_supported: "src/conversion/included_files_parts/posix_operations.py",
              TestIncludedFilesManagedRootTransaction: "tests/test_included_files.py",
          }
          assert all(Path(inspect.getfile(owner)).resolve() == root / path for owner, path in origins.items())
          ids = (
              "tests.test_included_files.TestIncludedFilesManagedRootTransaction.test_native_linux_same_device_bind_mount_is_rejected",
          )
          assert len(ids) == 1
          suite, discovered = load_suite(ids)
          assert discovered == ids
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert all(Path(inspect.getfile(owner)).resolve() == root / path for owner, path in origins.items())
          accepted = result.testsRun == 1 and result_is_allowed(result, {})
          print(json.dumps({"gate": "I02-linux-bind", "python": sys.executable, "prefix": sys.prefix,
                            "root": str(root), "runtime": [platform.python_version(), sys.platform, platform.machine()],
                            "origins": sorted(set(origins.values())), "selected_ids": list(discovered),
                            "tests_run": result.testsRun, "skip_count": len(result.skipped), "accepted": accepted}, sort_keys=True))
          raise SystemExit(0 if accepted else 1)
          PY

      - name: Run native Linux bind-mount transaction gate
        env:
          GM2GODOT_REQUIRE_LINUX_BIND_MOUNT: '1'
        run: >-
          python -m unittest -v
          tests.test_managed_output_crash_recovery.TestManagedOutputCrashRecovery.test_linux_bind_mount_is_rejected_without_reading_external_target

      - name: Enforce Python line and branch coverage floors
        run: python scripts/check_coverage.py --report coverage-reports/coverage.json

      - name: Upload Python coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-py3.12.13
          path: |
            coverage-reports/coverage.json
            coverage-reports/coverage.xml
          if-no-files-found: warn
          retention-days: 7
          archive: true

