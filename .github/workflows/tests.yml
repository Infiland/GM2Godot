  workflow-success:
    name: workflow-success
    if: always()
    needs: [test, macos-managed-output-transactions, windows-artifact-transactions, windows-included-files-scale, windows-managed-output-crash-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      REQUIRED_JOBS: ${{ toJSON(needs) }}
    steps:
      - name: Require successful validation jobs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {
              "test": "success",
              "macos-managed-output-transactions": "success",
              "windows-artifact-transactions": "success",
              "windows-included-files-scale": "success",
              "windows-managed-output-crash-recovery": "success",
          }
          actual = {name: job["result"] for name, job in json.loads(os.environ["REQUIRED_JOBS"]).items()}
          if actual != expected:
              raise SystemExit(f"Required jobs did not succeed: {actual}; expected {expected}")
          PY
