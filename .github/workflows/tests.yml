            --constraint constraints/requirements-windows-py312.lock \
            --output "$RUNNER_TEMP/tests-windows-bootstrap.json"
          python -m venv "$venv_dir"
          venv_bin="$venv_dir/Scripts"
          venv_native="$(cygpath -w "$venv_dir")"
          venv_path_native="$(cygpath -w "$venv_bin")"
          github_env_file="$(cygpath -u "$GITHUB_ENV")"
          github_path_file="$(cygpath -u "$GITHUB_PATH")"
          printf 'VIRTUAL_ENV=%s\n' "$venv_native" >> "$github_env_file"
          printf '%s\n' "$venv_path_native" >> "$github_path_file"
          export VIRTUAL_ENV="$venv_native"
          export PATH="$venv_bin:$PATH"
          hash -r
          python -c 'import os, pathlib, sys; raise SystemExit(0 if pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ["VIRTUAL_ENV"]).resolve() else 1)'
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-windows-py312.lock \
            pip
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-windows-py312.lock \
            -r requirements.txt
          python scripts/verify_dependency_environment.py \
            --constraint constraints/requirements-windows-py312.lock \
            --mode subset \
            --require pip \
            --require Pillow \
            --require markdown2 \
            --require requests \
            --require PySide6 \
            --expected-python 3.12.10 \
            --expected-platform win32 \
            --expected-machine AMD64 \
            --bootstrap requirements-bootstrap.txt \
            --bootstrap-policy stable \
            --output "$RUNNER_TEMP/tests-windows-dependencies.json"

      - name: Run required native receipt gate
        timeout-minutes: 10
        shell: bash
        env:
          NATIVE_RECEIPT_PROFILE: stable
        run: >-
          python -m scripts.run_required_unittest
          --manifest architecture-verification.json --gate N01-windows
          --receipt "$RUNNER_TEMP/n01-tests-windows.json"

      - name: Upload required native receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n01-tests-windows
          path: ${{ runner.temp }}/n01-tests-windows.json
          if-no-files-found: error
          retention-days: 30
          archive: true

      - name: Run Windows outcome and artifact transaction tests
        run: >-
          python -m unittest -v
          tests.test_conversion_outcome
          tests.test_conversion_manifest
          tests.test_generation_inventory
          tests.test_diagnostics
          tests.test_anchored_artifacts
          tests.test_architecture_policy
          tests.test_converter
          tests.test_converter_transaction
          tests.test_stale_managed_output_invalidation
          tests.test_cli
          tests.test_asset_registry
          tests.test_atomic_generated_text
          tests.test_managed_output_workspace
          tests.test_managed_output_publisher
          tests.test_included_files.TestIncludedFilesManagedRootTransaction
          tests.test_included_files.TestIncludedFilesConverterOutputContainment
          tests.test_godot_test_support

      - name: Run native windows artifact mode characterization
        run: >-
          python -m unittest -v
          tests.test_anchored_artifacts.TestAnchoredArtifacts.test_windows_readonly_hardlink_is_rejected_without_alias_mutation
          tests.test_anchored_artifacts.TestAnchoredArtifacts.test_windows_single_link_readonly_publish_and_restore

      - name: Run native Windows Included Files metadata
        shell: bash
        run: |
          venv_python="$(cygpath -u "$VIRTUAL_ENV")/Scripts/python.exe"
          "$venv_python" - "$GITHUB_WORKSPACE" "$VIRTUAL_ENV" <<'PY'
          import inspect
          import json
          import platform
          import sys
          import unittest
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          venv = Path(sys.argv[2]).resolve()
          assert Path.cwd().resolve() == root and Path(sys.prefix).resolve() == venv
          assert Path(sys.executable).resolve() == venv / "Scripts" / "python.exe"
          assert (platform.python_version(), sys.platform, platform.machine()) == ("3.12.10", "win32", "AMD64")

          from scripts.run_required_unittest import load_suite, result_is_allowed
          from src.conversion.included_files import IncludedFilesConverter
          from src.conversion.included_files_parts.filesystem_metadata import path_fingerprint
          from src.conversion.included_files_parts.posix_operations import descriptor_paths_supported
          from tests.included_files.test_filesystem_metadata import TestIncludedFilesFilesystemMetadata

          origins = {
              load_suite: "scripts/run_required_unittest.py",
              result_is_allowed: "scripts/run_required_unittest.py",
              IncludedFilesConverter: "src/conversion/included_files.py",
              path_fingerprint: "src/conversion/included_files_parts/filesystem_metadata.py",
              descriptor_paths_supported: "src/conversion/included_files_parts/posix_operations.py",
              TestIncludedFilesFilesystemMetadata: "tests/included_files/test_filesystem_metadata.py",
          }
          assert all(Path(inspect.getfile(owner)).resolve() == root / path for owner, path in origins.items())
          ids = (
              "tests.included_files.test_filesystem_metadata.TestIncludedFilesFilesystemMetadata.test_stat_projections_preserve_exact_fields_and_order",
              "tests.included_files.test_filesystem_metadata.TestIncludedFilesFilesystemMetadata.test_symlink_short_circuit_and_unavailable_junction_policy",
              "tests.included_files.test_filesystem_metadata.TestIncludedFilesFilesystemMetadata.test_junction_checker_result_and_error_are_forwarded",
          )
          assert len(ids) == 3
          suite, discovered = load_suite(ids)
          assert discovered == ids
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert all(Path(inspect.getfile(owner)).resolve() == root / path for owner, path in origins.items())
          accepted = result.testsRun == 3 and result_is_allowed(result, {})
          print(json.dumps({"gate": "I02-windows-metadata", "python": sys.executable, "prefix": sys.prefix,
                            "root": str(root), "runtime": [platform.python_version(), sys.platform, platform.machine()],
                            "origins": sorted(set(origins.values())), "selected_ids": list(discovered),
                            "tests_run": result.testsRun, "skip_count": len(result.skipped), "accepted": accepted}, sort_keys=True))
          raise SystemExit(0 if accepted else 1)
          PY

      - name: Run native Windows Godot output-reader scheduling tests
        run: >-
          python -m unittest -v
          tests.test_godot_validation.TestGodotValidation.test_timeout_reader_deferred_until_after_stop_retains_buffered_diagnostic
          tests.test_godot_validation.TestGodotValidation.test_reader_retries_after_output_arrives_during_stop_wait
          tests.test_godot_validation.TestGodotValidation.test_normal_completion_reader_oserror_is_capture_failure
          tests.test_godot_validation.TestGodotValidation.test_timeout_reader_oserror_is_capture_failure
          tests.test_godot_validation.TestGodotValidation.test_stop_deadline_leaves_stdout_owned_by_live_reader

