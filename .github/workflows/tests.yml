name: Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          architecture: x64

      - name: Install and verify test dependencies
        run: |
          venv_dir="$RUNNER_TEMP/gm2godot-tests-linux-venv"
          if [ -e "$venv_dir" ] || [ -L "$venv_dir" ]; then
            echo "::error::Refusing to reuse dependency environment: $venv_dir" >&2
            exit 1
          fi
          python scripts/verify_dependency_bootstrap.py \
            --source requirements-bootstrap.txt \
            --policy stable \
            --constraint constraints/requirements-linux-py312.lock \
            --output "$RUNNER_TEMP/tests-linux-bootstrap.json"
          python -m venv "$venv_dir"
          venv_bin="$venv_dir/bin"
          printf 'VIRTUAL_ENV=%s\n' "$venv_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$venv_bin" >> "$GITHUB_PATH"
          export VIRTUAL_ENV="$venv_dir"
          export PATH="$venv_bin:$PATH"
          hash -r
          python -c 'import os, pathlib, sys; raise SystemExit(0 if pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ["VIRTUAL_ENV"]).resolve() else 1)'
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            pip
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            -r requirements.txt
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            coverage==7.15.2 \
            packaging==26.2 \
            ruff==0.15.22
          python scripts/verify_dependency_environment.py \
            --constraint constraints/requirements-linux-py312.lock \
            --mode subset \
            --require pip \
            --require coverage \
            --require packaging \
            --require ruff \
            --require Pillow \
            --require markdown2 \
            --require requests \
            --require PySide6 \
            --expected-python 3.12.13 \
            --expected-platform linux \
            --expected-machine x86_64 \
            --bootstrap requirements-bootstrap.txt \
            --bootstrap-policy stable \
            --output "$RUNNER_TEMP/tests-linux-dependencies.json"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1

      - name: Run required native receipt gate
        timeout-minutes: 10
        shell: bash
        env:
          NATIVE_RECEIPT_PROFILE: stable
        run: >-
          python -m scripts.run_required_unittest
          --manifest architecture-verification.json --gate N01-linux
          --receipt "$RUNNER_TEMP/n01-tests-linux.json"

      - name: Upload required native receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n01-tests-linux
          path: ${{ runner.temp }}/n01-tests-linux.json
          if-no-files-found: error
          retention-days: 30
          archive: true

      - name: Run native linux artifact mode characterization
        run: >-
          python -m unittest -v
          tests.test_conversion_manifest.TestConversionManifest.test_existing_and_new_artifact_modes_remain_exact
          tests.test_diagnostics.TestDiagnosticCollector.test_new_private_modes_and_existing_exact_modes_are_preserved
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_descriptor_callbacks_return_final_mode
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_fd_chmod_rebinding_keeps_selected_rollback_callable
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_noop_and_expected_mode_guard_precedence
          tests.test_anchored_directory_modes.TestAnchoredDirectoryModes.test_descriptor_failures_preserve_errors_and_close

      - name: Run unit tests
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover tests/ -v

      - name: Generate Python coverage reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p coverage-reports
          python -m coverage report
          python -m coverage json
          python -m coverage xml

      - name: Run native Linux bind-mount transaction gate
        env:
          GM2GODOT_REQUIRE_LINUX_BIND_MOUNT: '1'
        run: >-
          python -m unittest -v
          tests.test_managed_output_crash_recovery.TestManagedOutputCrashRecovery.test_linux_bind_mount_is_rejected_without_reading_external_target

      - name: Enforce Python line and branch coverage floors
        run: python scripts/check_coverage.py --report coverage-reports/coverage.json

      - name: Upload Python coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-py3.12.13
          path: |
            coverage-reports/coverage.json
            coverage-reports/coverage.xml
          if-no-files-found: warn
          retention-days: 7
          archive: true

