name: Godot Headless Smoke

on:
  workflow_call:

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_ARCHIVE: Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BINARY: Godot_v4.7.2-stable_linux.x86_64
  GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIP_CONFIG_FILE: /dev/null

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          architecture: x64

      - name: Install and verify test dependencies
        run: |
          venv_dir="$RUNNER_TEMP/gm2godot-godot-smoke-venv"
          if [ -e "$venv_dir" ] || [ -L "$venv_dir" ]; then
            echo "::error::Refusing to reuse dependency environment: $venv_dir" >&2
            exit 1
          fi
          python scripts/verify_dependency_bootstrap.py \
            --source requirements-bootstrap.txt \
            --policy stable \
            --constraint constraints/requirements-linux-py312.lock \
            --output "$RUNNER_TEMP/godot-smoke-bootstrap.json"
          python -m venv "$venv_dir"
          venv_bin="$venv_dir/bin"
          printf 'VIRTUAL_ENV=%s\n' "$venv_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$venv_bin" >> "$GITHUB_PATH"
          export VIRTUAL_ENV="$venv_dir"
          export PATH="$venv_bin:$PATH"
          hash -r
          python -c 'import os, pathlib, sys; raise SystemExit(0 if pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ["VIRTUAL_ENV"]).resolve() else 1)'
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            pip
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            Pillow==12.3.0
          python scripts/verify_dependency_environment.py \
            --constraint constraints/requirements-linux-py312.lock \
            --mode subset \
            --require pip \
            --require Pillow \
            --expected-python 3.12.13 \
            --expected-platform linux \
            --expected-machine x86_64 \
            --bootstrap requirements-bootstrap.txt \
            --bootstrap-policy stable \
            --output "$RUNNER_TEMP/godot-smoke-dependencies.json"

      - name: Cache pinned Godot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/gm2godot/godot-${{ env.GODOT_VERSION }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE_SHA256 }}

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          godot_dir="$HOME/.cache/gm2godot/godot-${GODOT_VERSION}"
          godot_bin="${godot_dir}/${GODOT_BINARY}"
          if [ ! -x "$godot_bin" ]; then
            mkdir -p "$godot_dir"
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}" \
              --output "${RUNNER_TEMP}/${GODOT_ARCHIVE}"
            echo "${GODOT_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${GODOT_ARCHIVE}" | sha256sum --check --strict
            unzip -q "${RUNNER_TEMP}/${GODOT_ARCHIVE}" -d "$godot_dir"
            chmod +x "$godot_bin"
          fi
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          godot_build="$("$godot_bin" --version)"
          printf '%s\n' "$godot_build"
          test "$godot_build" = "4.7.2.stable.official.ed1daf0bf"

      - name: Run headless Godot smoke tests
        run: |
          python -m unittest discover -s tests -p 'test_*_godot.py' -v
          python -m unittest -v \
            tests.test_godot_validation \
            tests.test_golden_conversion \
            tests.test_project_settings

  workflow-success:
    name: workflow-success
    if: always()
    needs: [godot-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      REQUIRED_JOBS: ${{ toJSON(needs) }}
    steps:
      - name: Require successful validation jobs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {
              "godot-smoke": "success",
          }
          actual = {name: job["result"] for name, job in json.loads(os.environ["REQUIRED_JOBS"]).items()}
          if actual != expected:
              raise SystemExit(f"Required jobs did not succeed: {actual}; expected {expected}")
          PY
