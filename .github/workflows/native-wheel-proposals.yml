# First proof commit deliberately uses discover. Integration must change this
# exact fixed phase to require-committed; absent companions never select a phase.
name: Native Wheel Proposals

on:
  push:
    branches: [codex/native-intel-wheel-locks]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-wheel-proposals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PROOF_PHASE: discover

jobs:
  native:
    name: proposal / ${{ matrix.platform }} / Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            python_version: '3.12.13'
          - platform: macos-arm64
            runner: macos-26
            architecture: arm64
            python_version: '3.12.10'
          - platform: macos-x64
            runner: macos-26-intel
            architecture: x64
            python_version: '3.12.10'
          - platform: windows-x64
            runner: windows-2025
            architecture: x64
            python_version: '3.12.10'
    env:
      PROPOSAL_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Materialize exact source bytes as LF
        timeout-minutes: 5
        shell: bash
        run: git -c core.autocrlf=false -c core.eol=lf checkout-index --all --force

      - name: Set up exact native Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.architecture }}

      - name: Select fresh native proposal root
        id: runtime-roots
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY_RUNTIME_ROOTS'
          import os
          from pathlib import Path
          import re


          def require(condition, message):
              if not condition:
                  raise SystemExit("Native proposal runtime roots: " + message)


          require(re.fullmatch(r"[0-9a-f]{40}", os.environ.get("SOURCE_SHA", "")) is not None, "invalid source SHA")
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              require(re.fullmatch(r"[1-9][0-9]{0,19}", os.environ.get(name, "")) is not None, "invalid run binding")
          temporary = os.environ.get("RUNNER_TEMP", "")
          require(0 < len(temporary) <= 4096 and not any(character in temporary for character in "\r\n\0"), "invalid runner temporary path")
          require(Path(temporary).is_absolute(), "runner temporary path must be absolute")
          temporary = Path(temporary).resolve(strict=True)
          require(temporary.is_dir(), "runner temporary path must be a directory")
          platform = os.environ.get("PROPOSAL_PLATFORM", "")
          require(platform in ("linux-x64", "macos-arm64", "macos-x64", "windows-x64"), "invalid native platform")
          suffix = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          roots = {"PROPOSAL_ROOT": temporary / ("gm2godot-native-wheel-proposal-" + suffix + "-" + platform)}
          for root in roots.values():
              require(len(str(root)) <= 4096 and not os.path.lexists(root), "runtime root is oversized or already exists")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as export:
              for name, root in roots.items():
                  export.write(name + "=" + str(root) + "\n")
          print("Native proposal runtime roots selected")
          PY_RUNTIME_ROOTS

      - name: Prove native graph, wheels, self-hosting and two clean installs
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY_SOURCE_BINDING'
          import json
          import os
          import re
          import subprocess


          def require(condition, message):
              if not condition:
                  raise SystemExit("Native proposal source binding: " + message)


          def object_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate event field")
                  result[key] = value
              return result


          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          require(repository == "Infiland/GM2Godot", "noncanonical repository")
          require(re.fullmatch(r"[0-9a-f]{40}", source_sha) is not None, "invalid source SHA")
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              value = os.environ[name]
              require(re.fullmatch(r"[1-9][0-9]{0,19}", value) is not None, "invalid run binding")
          with open(os.environ["GITHUB_EVENT_PATH"], "rb") as event_file:
              event_bytes = event_file.read(1024 * 1024 + 1)
          require(len(event_bytes) <= 1024 * 1024, "event exceeds size bound")
          event = json.loads(event_bytes, object_pairs_hook=object_pairs)
          require(type(event) is dict, "invalid event object")
          require(event.get("repository", {}).get("full_name") == repository, "event repository mismatch")
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "push":
              require(os.environ["GITHUB_REF"] == "refs/heads/codex/native-intel-wheel-locks", "unexpected push ref")
              require(event.get("ref") == os.environ["GITHUB_REF"], "event push ref mismatch")
              require(event.get("deleted") is False, "deleted or malformed push")
              event_sha = event.get("after")
          elif event_name == "pull_request":
              require(event.get("action") in ("opened", "synchronize", "reopened"), "unexpected PR action")
              pull_request = event.get("pull_request", {})
              require(type(pull_request) is dict, "invalid pull request")
              base = pull_request.get("base", {})
              require(base.get("ref") == "main", "unexpected PR base")
              require(base.get("repo", {}).get("full_name") == repository, "noncanonical PR base repository")
              number = event.get("number")
              require(type(number) is int and number > 0, "invalid PR number")
              require(os.environ["GITHUB_REF"] == f"refs/pull/{number}/merge", "unexpected PR ref")
              event_sha = pull_request.get("head", {}).get("sha")
          else:
              raise SystemExit("Native proposal source binding: unsupported event")
          require(event_sha == source_sha, "event source SHA mismatch")
          head = subprocess.run(
              ["git", "--no-replace-objects", "-C", os.environ["GITHUB_WORKSPACE"], "rev-parse", "--verify", "HEAD^{commit}"],
              check=False, capture_output=True, text=True, timeout=30,
          )
          require(head.returncode == 0 and head.stdout.strip() == source_sha, "checkout HEAD mismatch")
          print("Native proposal event/source/run binding verified")
          PY_SOURCE_BINDING
          python -m unittest tests.test_native_wheel_proposals tests.test_native_wheel_proposal_validation
          python -I scripts/propose_native_wheels.py \
            --phase "$PROOF_PHASE" \
            --platform "$PROPOSAL_PLATFORM" \
            --source-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --work-root "$PROPOSAL_ROOT"

      - name: Retain proposal evidence including failures
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheel-proposal-${{ matrix.platform }}-py${{ matrix.python_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROPOSAL_ROOT }}/artifact/
          if-no-files-found: error
          retention-days: 7
          archive: true
          include-hidden-files: false
          overwrite: false

  aggregate:
    name: require all four native proposal proofs
    needs: native
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NATIVE_MATRIX_RESULT: ${{ needs.native.result }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Materialize exact source bytes as LF
        timeout-minutes: 5
        shell: bash
        run: git -c core.autocrlf=false -c core.eol=lf checkout-index --all --force

      - name: Select fresh aggregate roots
        id: runtime-roots
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY_RUNTIME_ROOTS'
          import os
          from pathlib import Path
          import re


          def require(condition, message):
              if not condition:
                  raise SystemExit("Native proposal runtime roots: " + message)


          require(re.fullmatch(r"[0-9a-f]{40}", os.environ.get("SOURCE_SHA", "")) is not None, "invalid source SHA")
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              require(re.fullmatch(r"[1-9][0-9]{0,19}", os.environ.get(name, "")) is not None, "invalid run binding")
          temporary = os.environ.get("RUNNER_TEMP", "")
          require(0 < len(temporary) <= 4096 and not any(character in temporary for character in "\r\n\0"), "invalid runner temporary path")
          require(Path(temporary).is_absolute(), "runner temporary path must be absolute")
          temporary = Path(temporary).resolve(strict=True)
          require(temporary.is_dir(), "runner temporary path must be a directory")
          suffix = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          roots = {
              "RAW_ROOT": temporary / ("gm2godot-native-proposal-archives-" + suffix),
              "AGGREGATE_ROOT": temporary / ("gm2godot-native-proposal-aggregate-" + suffix),
          }
          for root in roots.values():
              require(len(str(root)) <= 4096 and not os.path.lexists(root), "runtime root is oversized or already exists")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as export:
              for name, root in roots.items():
                  export.write(name + "=" + str(root) + "\n")
          print("Native proposal runtime roots selected")
          PY_RUNTIME_ROOTS

      - name: Download exact Linux proposal archive
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheel-proposal-linux-x64-py3.12.13-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAW_ROOT }}/linux-x64
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact macOS arm64 proposal archive
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheel-proposal-macos-arm64-py3.12.10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAW_ROOT }}/macos-arm64
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact macOS x64 proposal archive
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheel-proposal-macos-x64-py3.12.10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAW_ROOT }}/macos-x64
          skip-decompress: true
          digest-mismatch: error

      - name: Download exact Windows proposal archive
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheel-proposal-windows-x64-py3.12.10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAW_ROOT }}/windows-x64
          skip-decompress: true
          digest-mismatch: error

      - name: Independently require all four complete proofs
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY_SOURCE_BINDING'
          import json
          import os
          import re
          import subprocess


          def require(condition, message):
              if not condition:
                  raise SystemExit("Native proposal source binding: " + message)


          def object_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate event field")
                  result[key] = value
              return result


          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["SOURCE_SHA"]
          require(repository == "Infiland/GM2Godot", "noncanonical repository")
          require(re.fullmatch(r"[0-9a-f]{40}", source_sha) is not None, "invalid source SHA")
          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              value = os.environ[name]
              require(re.fullmatch(r"[1-9][0-9]{0,19}", value) is not None, "invalid run binding")
          with open(os.environ["GITHUB_EVENT_PATH"], "rb") as event_file:
              event_bytes = event_file.read(1024 * 1024 + 1)
          require(len(event_bytes) <= 1024 * 1024, "event exceeds size bound")
          event = json.loads(event_bytes, object_pairs_hook=object_pairs)
          require(type(event) is dict, "invalid event object")
          require(event.get("repository", {}).get("full_name") == repository, "event repository mismatch")
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "push":
              require(os.environ["GITHUB_REF"] == "refs/heads/codex/native-intel-wheel-locks", "unexpected push ref")
              require(event.get("ref") == os.environ["GITHUB_REF"], "event push ref mismatch")
              require(event.get("deleted") is False, "deleted or malformed push")
              event_sha = event.get("after")
          elif event_name == "pull_request":
              require(event.get("action") in ("opened", "synchronize", "reopened"), "unexpected PR action")
              pull_request = event.get("pull_request", {})
              require(type(pull_request) is dict, "invalid pull request")
              base = pull_request.get("base", {})
              require(base.get("ref") == "main", "unexpected PR base")
              require(base.get("repo", {}).get("full_name") == repository, "noncanonical PR base repository")
              number = event.get("number")
              require(type(number) is int and number > 0, "invalid PR number")
              require(os.environ["GITHUB_REF"] == f"refs/pull/{number}/merge", "unexpected PR ref")
              event_sha = pull_request.get("head", {}).get("sha")
          else:
              raise SystemExit("Native proposal source binding: unsupported event")
          require(event_sha == source_sha, "event source SHA mismatch")
          head = subprocess.run(
              ["git", "--no-replace-objects", "-C", os.environ["GITHUB_WORKSPACE"], "rev-parse", "--verify", "HEAD^{commit}"],
              check=False, capture_output=True, text=True, timeout=30,
          )
          require(head.returncode == 0 and head.stdout.strip() == source_sha, "checkout HEAD mismatch")
          print("Native proposal event/source/run binding verified")
          PY_SOURCE_BINDING
          mkdir "$AGGREGATE_ROOT"
          python3 -I scripts/verify_native_wheel_proposal.py \
            --phase "$PROOF_PHASE" \
            --source-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --native-jobs-result "$NATIVE_MATRIX_RESULT" \
            --artifact-root "$RAW_ROOT" \
            --output "$AGGREGATE_ROOT/acceptance.json"

      - name: Retain aggregate decision including failures
        if: ${{ always() && steps.runtime-roots.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheel-proposal-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AGGREGATE_ROOT }}/
          if-no-files-found: error
          retention-days: 7
          archive: true
          include-hidden-files: false
          overwrite: false
