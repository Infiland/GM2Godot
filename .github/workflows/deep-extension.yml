name: Build optional Deep extension

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish a new immutable Deep release after all platform checks
  pull_request:
    paths:
      - packaging/deep.lock.json
      - scripts/deep_release.py
      - .github/workflows/deep-extension.yml

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.lock.outputs.revision }}
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        run: python3 scripts/deep_release.py >> "$GITHUB_OUTPUT"

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win-x64
          - os: macos-26
            platform: darwin-arm64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Infiland/gm2godot-deep
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Build verified runtime bundle
        env:
          DEEP_REVISION: ${{ needs.source.outputs.revision }}
          CLIENT_REVISION: ${{ github.sha }}
          DEEP_VERSION: ${{ needs.source.outputs.version }}
          DEEP_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: >-
          python tools/build_bundle.py --platform "$DEEP_PLATFORM" --output bundles
          --source-revision "$DEEP_REVISION" --client-revision "$CLIENT_REVISION"
          --release-base-url "https://github.com/Infiland/GM2Godot/releases/download/deep-v$DEEP_VERSION"
      - name: Smoke test packaged host without system Node
        run: python tools/smoke_bundle.py bundles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: deep-${{ matrix.platform }}
          path: bundles/*
          if-no-files-found: error

  seal:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deep-*
          path: bundles
          merge-multiple: true
          digest-mismatch: error
      - name: Seal compatible bundles
        env:
          CLIENT_REVISION: ${{ github.sha }}
        run: python3 scripts/deep_release.py --output bundles --client-revision "$CLIENT_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: deep-release
          path: |
            bundles/*.zip
            bundles/deep-manifest.json
      - name: Publish a new extension version
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DEEP_VERSION: ${{ needs.source.outputs.version }}
          CLIENT_REVISION: ${{ github.sha }}
        run: |
          printf 'Optional Deep conversion extension. Source and package hashes are recorded in deep-manifest.json.\n' > release-notes.txt
          gh release create "deep-v$DEEP_VERSION" bundles/*.zip bundles/deep-manifest.json --target "$CLIENT_REVISION" --latest=false --title "Deep conversion $DEEP_VERSION" --notes-file release-notes.txt
