[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GM2Godot"
dynamic = ["version"]
description = "Convert GameMaker Studio 2 projects and assets to Godot"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "Pillow==12.3.0",
  "markdown2==2.5.5",
  "requests==2.34.2",
  "urllib3==2.8.0",
  "PySide6==6.11.1",
  "keyring==25.7.0",
]

[project.urls]
Repository = "https://github.com/Infiland/GM2Godot"
Issues = "https://github.com/Infiland/GM2Godot/issues"
Documentation = "https://github.com/Infiland/GM2Godot/wiki"

[project.scripts]
gm2godot = "main:main"

[project.gui-scripts]
gm2godot-gui = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "src.version.VERSION"}

[tool.setuptools.package-data]
"src.conversion.gml_runtime_parts" = ["segments/*.gd"]
"src.application_assets" = ["Current Language", "img/*.png", "Languages/*.json"]

[tool.setuptools.cmdclass]
build_py = "scripts.build_application_assets.BuildApplicationAssets"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "build",
  "dist",
  "release",
  "venv",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B002",
  "B003",
  "B004",
  "B005",
  "B006",
  "B008",
  "B011",
  "B012",
  "B014",
  "B015",
  "B016",
  "B017",
  "B018",
  "B019",
  "B020",
  "B021",
  "B022",
  "B025",
  "B029",
  "B030",
  "B031",
  "B032",
  "B033",
  "B035",
  "B039",
  "B905",
]

[tool.ruff.lint.isort]
combine-as-imports = true
