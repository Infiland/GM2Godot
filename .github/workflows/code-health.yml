name: Code Health

on:
  workflow_call:

jobs:
  ruff:
    runs-on: ubuntu-24.04
    env:
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce Dependabot authored-input boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "$PR_BASE_SHA" =~ $sha_pattern || ! "$PR_HEAD_SHA" =~ $sha_pattern ]]; then
            echo "::error::Dependabot boundary received an invalid pull-request commit SHA." >&2
            exit 1
          fi
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          if [[ ! "$merge_base" =~ $sha_pattern ]]; then
            echo "::error::Dependabot boundary could not resolve one valid PR merge base." >&2
            exit 1
          fi

          changed_paths_file="$(mktemp \
            "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gm2godot-dependabot-paths.XXXXXX")"
          trap 'rm -f -- "$changed_paths_file"' EXIT
          if ! git diff --name-only --no-renames -z \
            "$merge_base" "$PR_HEAD_SHA" -- > "$changed_paths_file"; then
            echo "::error::Dependabot boundary could not enumerate the complete PR diff." >&2
            exit 1
          fi

          changed_paths=()
          while IFS= read -r -d '' changed_path; do
            changed_paths+=("$changed_path")
          done < "$changed_paths_file"

          bootstrap_changed=false
          for changed_path in "${changed_paths[@]}"; do
            if [[ "$changed_path" == constraints/requirements-*-py312.lock ]]; then
              printf '::error::Dependabot must not edit a native generated lock (%q); regenerate and review all three native artifacts.\n' \
                "$changed_path" >&2
              exit 1
            fi
            if [[ "$changed_path" == requirements-bootstrap.txt ]]; then
              bootstrap_changed=true
            fi
          done

          if [[ "$bootstrap_changed" == true ]]; then
            for changed_path in "${changed_paths[@]}"; do
              if [[ "$changed_path" != requirements-bootstrap.txt ]]; then
                printf '::error::A pip bootstrap proposal must be limited to requirements-bootstrap.txt; unexpected path: %q.\n' \
                  "$changed_path" >&2
                exit 1
              fi
            done
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          architecture: x64

      - name: Install and verify Ruff
        run: |
          venv_dir="$RUNNER_TEMP/gm2godot-ruff-venv"
          if [ -e "$venv_dir" ] || [ -L "$venv_dir" ]; then
            echo "::error::Refusing to reuse dependency environment: $venv_dir" >&2
            exit 1
          fi
          python scripts/verify_dependency_bootstrap.py \
            --source requirements-bootstrap.txt \
            --policy stable \
            --constraint constraints/requirements-linux-py312.lock \
            --output "$RUNNER_TEMP/ruff-bootstrap.json"
          python -m venv "$venv_dir"
          venv_bin="$venv_dir/bin"
          printf 'VIRTUAL_ENV=%s\n' "$venv_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$venv_bin" >> "$GITHUB_PATH"
          export VIRTUAL_ENV="$venv_dir"
          export PATH="$venv_bin:$PATH"
          hash -r
          python -c 'import os, pathlib, sys; raise SystemExit(0 if pathlib.Path(sys.prefix).resolve() == pathlib.Path(os.environ["VIRTUAL_ENV"]).resolve() else 1)'
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            pip
          python -m pip --isolated --disable-pip-version-check --no-input install --no-cache-dir --only-binary=:all: \
            --constraint constraints/requirements-linux-py312.lock \
            ruff==0.15.22
          python scripts/verify_dependency_environment.py \
            --constraint constraints/requirements-linux-py312.lock \
            --mode subset \
            --require pip \
            --require ruff \
            --expected-python 3.12.13 \
            --expected-platform linux \
            --expected-machine x86_64 \
            --bootstrap requirements-bootstrap.txt \
            --bootstrap-policy stable \
            --output "$RUNNER_TEMP/ruff-dependencies.json"

      - name: Enforce shrinking maintainability debt
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_ref="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          else
            base_ref="$PUSH_BASE_SHA"
          fi
          if [[ ! "$base_ref" =~ ^[0-9a-f]{40}$ || "$base_ref" =~ ^0+$ ]]; then
            echo "::error::Maintainability requires the PR merge-base or previous push SHA." >&2
            exit 1
          fi
          python scripts/check_maintainability.py \
            --baseline maintainability-baseline.json --base-ref "$base_ref"
          python -m unittest tests.test_maintainability_policy tests.test_maintainability_metrics -v

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Ruff on every tracked lint input
        run: |
          git ls-files -z -- '*.py' '*.pyi' '*.pyw' '*.ipynb' '*.md' |
            xargs -0 -- python -m ruff check --isolated --target-version py312 --line-length 120 \
              --config lint.isort.combine-as-imports=true --config lint.isort.split-on-trailing-comma=false \
              --select E4,E7,E9,F,I --ignore-noqa --no-respect-gitignore --no-force-exclude --

  workflow-success:
    name: workflow-success
    if: always()
    needs: [ruff]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      REQUIRED_JOBS: ${{ toJSON(needs) }}
    steps:
      - name: Require successful validation jobs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {
              "ruff": "success",
          }
          actual = {name: job["result"] for name, job in json.loads(os.environ["REQUIRED_JOBS"]).items()}
          if actual != expected:
              raise SystemExit(f"Required jobs did not succeed: {actual}; expected {expected}")
          PY
